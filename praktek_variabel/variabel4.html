<!doctype html>
<html>
  <head>
    <title>Belajar Variable</title>
  </head>
  <body>
    <script>
      let hargaUji = Number(prompt("Masukkan harga: "));
      let jumlahUji = Number(prompt("Masukkan jumlah: "));
      let totalUji = hargaUji * jumlahUji;
      console.log("Total belanja = " + totalUji);
    </script>
  </body>
</html>
